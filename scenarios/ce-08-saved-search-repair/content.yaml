title: Repair a broken saved search
summary: >
  A saved search stopped returning results. Cursor CLI runs it, reads the parser error, finds the
  macro that was deleted, and proposes the fix. splunkctl holds the repair until you approve, then
  the agent reruns the search to show it works.
