# What gets recorded. Written by authoring agents and PRs only; never edited in a CMS.
# A guided threat hunt in a Jupyter notebook that GitHub Copilot CLI runs through jpterm, on a stack with Machine Data Lake.
# Stack side: fixtures/MDL_SETUP.md.
id: so-03-notebook-spray-hunt
useCase: SO-03
source: captured
change: Gated write
stack: co2-mdl
client:
  name: copilot-cli
  label: GitHub Copilot
  model: Auto
# Copilot CLI draws a failed command as one line that ends with the first line of its output; 110 columns keep
# "CONFIRMATION_REQUIRED: cell <id>" on it.
terminal: { cols: 110, rows: 32 }

capture:
  status: captured
  take: take-4
  month: Nov 2026
  # Waits where only Copilot's spinner moves are cut; six holds freeze the evidence screens and carry the narration.
  # The raw take ran 3 min 1 s.
  timeCompressed: true
  rawDuration: 180.7
  notes: >
    Recorded from the beats in this file with GitHub Copilot CLI 1.0.114 (Auto, which picked Claude Sonnet 5.5) in a neutral
    capture home on the MDL stack (stack profile mdl). Copilot runs with all tools allowed and the Splunk MCP write
    tools denied, so jpterm's CONFIRMATION_REQUIRED on the three lake cells is the only stop. The triage searches
    index=demo_auth live through Splunk MCP. The lake was unavailable on the day of this take (its SPL2 raw search and
    Open Sharing both failed on the stack side), so the notebook read the same story built in memory, anchored to the
    day the stack was seeded (lake.py fixture mode); its setup cell prints "lake: fixture", and Copilot says so.

cast:
  src: artifacts/session.cast
  duration: 166.9

# Stable IDs; times are seconds on the published cast clock, set by hand after each capture. Labels: content.yaml.
chapters:
  - { id: triage, t: 0 }
  - { id: notebook, t: 48.5 }
  - { id: lake, t: 64.2 }
  - { id: table, t: 82.3 }
  - { id: backtest, t: 98.6 }
  - { id: detection, t: 139.9 }

# Each gate pauses on the agent's approval question, just before the next prompt. Copy: content.yaml `gates`.
gates:
  - { id: gate-lake, t: 62.9, command: jpterm execute hunt.ipynb --cell raw-search, summary: "Searching the lake stopped at CONFIRMATION_REQUIRED until you approved" }
  - { id: gate-table, t: 81.0, command: jpterm execute hunt.ipynb --cell load-shared, summary: "Loading the shared table stopped at CONFIRMATION_REQUIRED until you approved" }
  - { id: gate-backtest, t: 97.3, command: jpterm execute hunt.ipynb --cell backtest, summary: "The backtest stopped at CONFIRMATION_REQUIRED until you approved" }

# How this demo is recorded: `python -m pipeline.capture scenarios/so-03-notebook-spray-hunt <take>`.
recording:
  home: /Users/Shared/splunk-demo
  workspace: payments
  # The MDL-enabled stack: its Splunk Web, splunkctl config, and MCP token come from .captures/ce01/stacks/mdl
  # (python3 scripts/stack_profile.py init mdl).
  stackProfile: mdl
  # No Splunk Web screenshots in this demo, and the MDL stack signs in with SSO.
  splunkWebLogin: false
  # Adds the gated jpterm (the three cells below stop with CONFIRMATION_REQUIRED) and euporie-preview.
  integrations: [notebook]
  notebook:
    gated: [raw-search, load-shared, backtest]
  hints: [notebook-hunt]
  # The executed notebook, outputs and all; pipeline.post publishes it as artifacts/hunt.ipynb.
  keep: [hunt.ipynb]
  # The wrapper's refusal is short on purpose: the clients truncate long shell output. Each gate also names its cell.
  gateEvidence: "CONFIRMATION_REQUIRED"
  fixtures:
    # `fixture`: the lake was unavailable for this take (its SPL2 raw search and Open Sharing both failed on the stack
    # side), so the notebook reads the same story built in memory, anchored to the day the stack was seeded, and its
    # setup cell says so. Drop both `fixture` arguments to record against the lake.
    setup:
      # Refuses to record unless the profile exists and the stack holds the story (scripts/seed_auth.py).
      - bash scenarios/so-03-notebook-spray-hunt/fixtures/setup.sh fixture
    stage:
      # Puts hunt.ipynb, lake.py, show.py, the lake settings, and two lookup files in the emptied workspace.
      - bash scenarios/so-03-notebook-spray-hunt/fixtures/stage.sh fixture 2026-11-24
    teardown:
      - bash scenarios/so-03-notebook-spray-hunt/fixtures/teardown.sh
  beats:
    - { comment: "Hunt a password spray in a notebook, with Splunk MCP and the Machine Data Lake", mark: intro }
    - { run: copilot, waitFor: "open sidebar" }
    # Short turns, so each one ends with an answer on screen. The terminal truncates tool output, which is why the
    # hint asks for a short message after every step. The three approvals are the turns that end at a refusal.
    - prompt: >
        Our alert on 100 failed sign-ins in 5 minutes has been quiet, but I suspect someone is spraying passwords
        slowly. Check the last 14 days of index demo_auth and tell me which source IP looks like it.
      mark: triage
    - { wait: turn-end, timeout: 600, mark: triage-done }
    - prompt: >
        Good. Open hunt.ipynb: start its kernel, put that IP in the params cell, run setup, then run raw-search to
        see the IP's full history in the lake.
      mark: notebook
    - { wait: turn-end, timeout: 600, mark: gate-lake, require: gate, evidence: "CONFIRMATION_REQUIRED: cell raw-search" }
    - prompt: "Approved. Run it and tell me what the lake shows. Then run load-shared."
      mark: lake
    - { wait: turn-end, timeout: 600, mark: gate-table, require: gate, evidence: "CONFIRMATION_REQUIRED: cell load-shared" }
    - prompt: "Approved. Load it, tell me what is in the table, then run backtest."
      mark: table
    - { wait: turn-end, timeout: 600, mark: gate-backtest, require: gate, evidence: "CONFIRMATION_REQUIRED: cell backtest" }
    - prompt: >
        Approved. Run the backtest, then enrich and detection, and tell me what we found and what to do next.
      mark: backtest
    - { wait: turn-end, timeout: 900, mark: agent-done }
    # The closing shot: the viewer leaves Copilot and shows the executed notebook, outputs and all, in the terminal.
    # Not in Copilot's shell mode, which prints euporie's color codes as text.
    - { leave: true }
    - run: "euporie-preview hunt.ipynb"
      waitFor: "\\[\\d+\\] Daily saved search"
      # For the transcript, which has no output for commands run outside the client.
      result: "The executed notebook in the terminal, every cell with its output. It is the artifact below."
      mark: detection
    - { exit: true, mark: outro }

# The notebook beside the terminal, cell by cell as Copilot runs it (pipeline/notebook_pane.py, from the jpterm trace).
notebookPane: { notebook: hunt.ipynb, cast: artifacts/notebook.cast, cols: 100 }

artifacts:
  transcript: artifacts/transcript.json
  # Shown in the transcript after the last command that ran it.
  notebooks: [artifacts/hunt.ipynb]

# Freeze frames on the evidence so narration can explain it (pipeline/post.py). The texts are this take's wording;
# Copilot renders inline code with a space on each side, so the patterns avoid code spans. Gates need no hold: the
# player pauses there. The last hold carries the closing narration (the outcome and why it matters). Copilot draws each message whole, and its spinner never lets the output pause, so every hold
# is immediate.
post:
  holds:
    - { id: suspect, text: "Every other IP has only", seconds: 9, settle: 0.06 }
    - { id: history, text: "Lake shows 688", seconds: 9, settle: 0.06 }
    - { id: table, text: "105,338 sign-ins", seconds: 8, settle: 0.06 }
    - { id: rule, text: "The rule flags only", seconds: 9, settle: 0.06 }
    - { id: finding, text: "Next steps \\(your call\\)", seconds: 16, settle: 0.06 }
    - { id: detection, text: "tries<=3", seconds: 22, settle: 0.06 }

# Spoken over the published cast. `python -m pipeline.narrate scenarios/so-03-notebook-spray-hunt` builds the audio
# and captions; rerun it after changing a line, an anchor, a chapter time, or the voice.
narration:
  audio: artifacts/narration.mp3
  captions: artifacts/narration.vtt
  lines:
    # Hot index triage
    - id: intro
      chapter: triage
      offset: 0.3
      text: A password-spray alert has been quiet for weeks. Here GitHub Copilot CLI hunts for a slow spray with Splunk and the Machine Data Lake.
    - id: ask
      t: 10.6
      text: The hunter asks Copilot to check the last fourteen days of sign-ins and name the source that looks like a spray.
    - id: searches
      t: 18.4
      text: Copilot queries the hot index through Splunk MCP. When a search errors, it simplifies the query and tries again.
    - id: why-quiet
      t: 27.4
      text: It counts failures and distinct accounts per source, because a spray that tries each account once never trips an alert on a hundred failures.
    - id: suspect
      t: 37.5
      text: "One address stands out: over five hundred failures on three hundred accounts."
    - id: vpn
      t: 44.2
      text: "The busy VPN fails too, but mostly succeeds: the false positive to avoid."
    # Notebook, then the first approval
    - id: notebook
      t: 51.5
      text: Copilot opens the hunt notebook, shown on the right, and sets the suspect IP.
    - id: fixture
      t: 57.8
      text: Setup reports a fixture, since the lake is down today.
    - id: lake-approved
      chapter: gate-lake
      offset: 0.8
      text: Approved, the raw search pulls this address's full history, a hundred and twenty days.
    - id: history
      t: 70.4
      text: The index saw ten days. The lake shows a September campaign in amber, a quiet October, then a return.
    # Shared table
    - id: table-approved
      chapter: gate-table
      offset: 0.8
      text: Copilot loads the shared ninety-day table straight into pandas.
    - id: early
      t: 87.2
      text: It also tries the backtest early. The gate stops it.
    - id: table-result
      t: 92.0
      text: A hundred and five thousand sign-ins, the suspect on top.
    # Backtest, enrichment, and the finding
    - id: backtest-approved
      chapter: gate-backtest
      offset: 0.8
      text: The backtest runs the new rule over every sign-in in the kernel. Nothing is written to Splunk.
    - id: rule
      t: 105.2
      text: It flags only the suspect, on thirteen days. Each dot is one address on one day, and the busy VPN stays under the line.
    - id: intel
      t: 115.8
      text: Enrichment finds it in a community threat feed, and a successful sign-in to a privileged backup account at three in the morning.
    - id: finding
      t: 124.2
      text: "Copilot sums up: reset that account, block the address, save the detection. It also flags that the results came from a fixture."
    - id: traceable
      t: 134.4
      text: Every claim traces back to a notebook cell, so the hunt is easy to review.
    # The executed notebook, and why it matters
    - id: record
      chapter: detection
      offset: 0.3
      text: "The executed notebook is the record, ending in the daily search to save as the alert."
    - id: value-data
      t: 147.3
      text: Splunk keeps fourteen hot days fast, and the Machine Data Lake keeps months of history cheaply.
    - id: value-agent
      t: 154.9
      text: An agent turns that history into a tested detection in minutes, with a person approving every costly step.
    - id: value-close
      t: 163.0
      text: Faster hunts, fewer missed attacks.
