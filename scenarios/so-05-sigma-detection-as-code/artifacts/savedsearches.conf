[ACME SOC - Process Memory Dump Via Comsvcs DLL - Rule]
action.escu = 0
action.escu.enabled = 1
description = Detects a process memory dump via comsvcs.dll using rundll32, covering multiple different techniques (ordinal, MiniDump function, etc.). Attackers such as Volt Typhoon use it to dump LSASS memory and harvest credentials with a signed Windows binary. Converted from SigmaHQ rule 646ea171-dded-4578-8a4d-65e9822892e3. 
