# What visitors read. Editable without a new capture.
title: "Detection as Code (DaC): Automated Detection Refactoring via Agentic Workflows"
summary: >
  ESCU's rule for LSASS dumping with comsvcs.dll is off, and it misses the same call made by ordinal. GitHub Copilot
  CLI turns SigmaHQ's community rule into an Enterprise Security detection with tests, opens a pull request, and
  reads what CI found: every test passes, but a week of endpoint data shows nightly alerts that Splunk AI Toolkit
  triages as the purple team. Copilot tunes them out the way the team already does, and the detection ships when
  you approve the merge.
