name: HackTool Mimikatz Execution
id: a642964e-bead-4bed-8910-1bb4d63e3b4d
version: 1
date: '2023-02-21'
author: Teymur Kheirkhabarov, oscd.community, David ANDRE (additional keywords), Tim Shelton (Sigma); ACME SOC
status: production
enabled_by_default: true
type: TTP
description: Detection well-known mimikatz command line arguments Converted from SigmaHQ rule a642964e-bead-4bed-8910-1bb4d63e3b4d.
data_source:
- Sysmon EventID 1
search: '| tstats `security_content_summariesonly` count min(_time) as firstTime max(_time) as lastTime from datamodel=Endpoint.Processes
  where Processes.process IN ("*DumpCreds*", "*mimikatz*") OR Processes.process IN ("*::aadcookie*", "*::detours*",
  "*::memssp*", "*::mflt*", "*::ncroutemon*", "*::ngcsign*", "*::printnightmare*", "*::skeleton*", "*::preshutdown*",
  "*::mstsc*", "*::multirdp*") OR Processes.process IN ("*rpc::*", "*token::*", "*crypto::*", "*dpapi::*", "*sekurlsa::*",
  "*kerberos::*", "*lsadump::*", "*privilege::*", "*process::*", "*vault::*") by Processes.dest Processes.user Processes.parent_process_name
  Processes.parent_process Processes.process_name Processes.process Processes.process_id Processes.parent_process_id
  Processes.original_file_name | `drop_dm_object_name(Processes)` | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)`
  | `hacktool_mimikatz_execution_filter`'
how_to_implement: Requires Sysmon EventID 1 process creation events with full command lines, parsed by the Splunk
  Add-on for Sysmon and mapped to the Endpoint.Processes data model.
known_false_positives: Unlikely
references:
- https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_hktl_mimikatz_command_line.yml
drilldown_searches:
- name: View the detection results for $user$ and $dest$
  search: '%original_detection_search% | search user=$user$ dest=$dest$'
  earliest_offset: $info_min_time$
  latest_offset: $info_max_time$
- name: View risk events for the last 7 days for $user$ and $dest$
  search: '| from datamodel Risk.All_Risk | search normalized_risk_object IN ($user$, $dest$) | stats count min(_time)
    as firstTime max(_time) as lastTime values(search_name) as "Search Name" values(risk_message) as "Risk Message"
    by normalized_risk_object | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)`'
  earliest_offset: 7d
  latest_offset: '0'
rba:
  message: 'HackTool Mimikatz Execution: $process_name$ on $dest$ by $user$'
  risk_objects:
  - field: dest
    type: system
    score: 72
  - field: user
    type: user
    score: 72
  threat_objects:
  - field: process_name
    type: process_name
tags:
  analytic_story:
  - Credential Dumping
  asset_type: Endpoint
  mitre_attack_id:
  - T1003.001
  - T1003.002
  - T1003.004
  - T1003.005
  - T1003.006
  product:
  - Splunk Enterprise
  - Splunk Enterprise Security
  - Splunk Cloud
  security_domain: endpoint
tests:
- name: True Positive Test
  attack_data:
  - data: https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1003.001/atomic_red_team/windows-sysmon.log
    source: XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
    sourcetype: XmlWinEventLog
