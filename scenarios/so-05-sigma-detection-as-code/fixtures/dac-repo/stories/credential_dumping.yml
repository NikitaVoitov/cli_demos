name: Credential Dumping
id: 854d78bf-d0e2-4f4e-b05c-640905f86d7a
version: 1
date: '2026-11-27'
author: ACME SOC
status: production
description: Detect attempts to read credentials from LSASS memory, the credential store most often targeted after initial access.
narrative: Attackers who gain local admin rights dump LSASS memory with built-in or signed tools (ProcDump, comsvcs.dll, Task Manager) or with hacking tools such as Mimikatz, then reuse the credentials to move laterally.
references:
- https://attack.mitre.org/techniques/T1003/001/
