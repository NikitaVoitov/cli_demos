# What gets recorded. Written by authoring agents and PRs only; never edited in a CMS.
id: ce-01-dashboard
useCase: CE-01
source: captured
change: Gated write
stack: co2
client:
  name: cursor-cli
  label: Cursor
  version: 2026.11.13-eacade1
  model: Auto Balance
# Split demos give the terminal ~600 px, so capture narrower than the 110x30 default to stay legible.
terminal: { cols: 88, rows: 28 }

capture:
  # captured: artifacts come from one real, approved Cursor CLI run against CO2.
  status: captured
  take: take-6
  month: Nov 2026
  splunkctl: 0.1.2
  # The published cast keeps every command, output, and message, but waits where only the spinner moves
  # are cut to 0.8 s (pipeline/post.py). The raw take ran 6 min 14 s.
  timeCompressed: true
  rawDuration: 373.8
  notes: >
    Recorded from the beats in this file (scripts/ce01_record.sh runs them) in a neutral capture home (/Users/Shared/splunk-demo) with
    approvalMode unrestricted, so splunkctl's CONFIRMATION_REQUIRED is the only gate. The capture shell
    puts a splunkctl wrapper on PATH that adds --insecure, because this staging stack's REST port uses a
    non-public CA. Data: 86,400 synthetic events in index=demo_checkout, loaded with scripts/seed_checkout.spl.
    The Splunk Web screenshot was taken by scripts/ce01_screenshot.mjs right after the run.

cast:
  src: artifacts/session.cast
  duration: 134.3

# Stable IDs; times are seconds on the published cast clock, reviewed by hand after each capture.
chapters:
  - { id: prompt, t: 0 }
  - { id: draft-spl, t: 28.1 }
  - { id: approval, t: 84.7 }
  - { id: deploy, t: 92.0 }
  - { id: render-check, t: 96.3 }

gate:
  t: 87.4
  command: splunkctl dashboard add demo_checkout_latency --file ~/payments/checkout_latency.xml --app search

browser:
  mode: agent
  showAt: render-check
  object: demo_checkout_latency
  screenshot: artifacts/dashboard.png   # viewport only, 1440x1220 CSS px at 1.5x, no browser chrome

artifacts:
  dashboard: artifacts/checkout_latency.json
  transcript: artifacts/transcript.json

# Spoken over the published cast. `python -m pipeline.narrate scenarios/ce-01-dashboard` builds the audio and
# captions; rerun it after changing a line, an anchor, a chapter time, or the voice (recorder/voice.yaml).
narration:
  audio: artifacts/narration.mp3
  captions: artifacts/narration.vtt
  lines:
    - id: intro
      chapter: prompt
      offset: 0.3
      text: Here, Cursor CLI builds a Splunk dashboard from one plain-language prompt on a real Splunk Cloud stack.
    - id: health
      t: 9.4
      text: A quick splunkctl check first. The stack is green.
    - id: ask
      t: 15.4
      text: >
        The prompt asks for four panels, from p95 latency to latency by region, then a deploy and a check that
        every panel renders.
    - id: plan
      t: 26.1
      text: Now Cursor plans the work.
    - id: skills
      chapter: draft-spl
      offset: 2.4
      text: Cursor loads Agent Skills for Dashboard Studio and splunkctl, so it follows Splunk's conventions instead of guessing.
    - id: discover
      t: 38.8
      text: Through the Splunk MCP Server, it finds the checkout index, samples the fields, and tests each search.
    - id: numbers
      t: 48.6
      text: p95 latency is about 480 milliseconds, and half a percent of requests fail with a server error.
    - id: real-data
      t: 57.2
      text: That's the difference from a template. Every panel starts from a search that already returned real data.
    - id: existing
      t: 65.3
      text: It also lists the dashboards already in Splunk, to match how they're stored before writing its own.
    - id: write
      t: 73.6
      text: With the data confirmed, it writes the Dashboard Studio definition.
    - id: gate
      t: 79.2
      text: Deploying is a write, so splunkctl stops it and waits for your approval.
    - id: deploy
      chapter: gate
      offset: 0.8
      text: Approved. Cursor reruns the same command with your go-ahead, and the dashboard is created.
    - id: render
      chapter: render-check
      offset: 0.4
      text: Next, it opens the dashboard in Splunk Web with Playwright and checks all four panels.
    - id: read-page
      t: 103.6
      text: Instead of eyeballing a screenshot, it reads the live page and checks each panel for real values, not an empty chart.
    - id: regions
      t: 113.3
      text: Region names in the bar chart prove the last panel has data too.
    - id: result
      t: 120.3
      text: Every panel renders, with the numbers it found in the data.
    - id: outro
      t: 125.7
      text: A final shell check confirms the dashboard is live. One prompt, one approval, and a verified dashboard.

# How this demo is recorded. `python -m pipeline.capture <scenario> <take>` runs it;
# the same runner and beat types serve every demo, so CE-08 adds a block like this and no new script.
recording:
  home: /Users/Shared/splunk-demo
  workspace: payments
  hints: [dashboards, splunk-web]            # recorder/hints/<name>.md, appended to the workspace instructions
  # A take is only approved when the cast shows splunkctl refusing the write. The TUI truncates the
  # error, so the check looks for the part that stays visible.
  gateEvidence: "requires confirmation"
  fixtures:
    setup:
      # Refuse to start over a dashboard left behind by an earlier take.
      - "splunkctl --insecure dashboard show demo_checkout_latency --app search -o json | grep -q NOT_FOUND"
    teardown: []                  # the dashboard has to stay up for the screenshot
  beats:
    - { comment: "Build a checkout latency dashboard with Cursor CLI", mark: intro }
    - { run: agent, waitFor: "Plan, search, build anything" }
    - { shell: "splunkctl server health -o table", waitFor: green, mark: health }
    - prompt: >
        Build a Dashboard Studio dashboard for checkout latency from our Splunk data: p95 latency,
        5xx rate, latency over time, and latency by region for the last 24 hours. Save it as
        checkout_latency.json, deploy it as demo_checkout_latency, then check in Splunk Web that
        every panel renders.
      mark: prompt
    - { wait: turn-end, timeout: 900, mark: gate-question, require: gate }
    - { prompt: "Approved. Deploy it once.", mark: approve }
    - { wait: turn-end, timeout: 900, mark: agent-done }
    - shell: "splunkctl dashboard list --name demo_checkout_latency --app search -o json | jq '.[0] | {name, label, version, app}'"
      waitFor: '"version"'
      mark: verify
    - { exit: true, mark: outro }
